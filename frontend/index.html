<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e0c" media="(prefers-color-scheme: dark)" />
    <title>CCM Network · Carbon Credit Measurement</title>
    <meta name="description" content="The Carbon Credit Standard. Verified. Onchain. DeFi-native." />
    <script>
      // Theme bootstrap — runs before React mounts to prevent flash.
      (() => {
        const stored = localStorage.getItem("ccm-theme");
        const prefers = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const theme = stored === "dark" || stored === "light" ? stored : prefers;
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
