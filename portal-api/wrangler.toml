name = "ccm-portal-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# ----------------------------------------------------------------------------
# Per docs/ccm-phase0-architecture.md §2:
# portal.ccmnetwork.net targets Base mainnet (chainId 8453).
# Vesting address is filled in only after the Phase 0 mainnet deploy.
# Until then, deploys to a placeholder pages.dev URL for development.
# ----------------------------------------------------------------------------

[vars]
ALLOWED_ORIGIN = "https://portal.ccmnetwork.net"
RPC_URL = "https://mainnet.base.org"
CHAIN_ID = "8453"
CCM_VESTING_ADDRESS = "0x019B68683a8c31f4A8295215D8Da7f8Ec95582dc"  # Phase 1 mainnet deploy 2026-05-12
CCM_KYC_REGISTRY_ADDRESS = "0x0000000000000000000000000000000000000000"  # TODO: Phase 2/3 — set after KYC Registry mainnet deploy (Base Sepolia rehearsal: 0x9172D6eaF05587b595f4eE894B4C7917Be652E46)
CCM_TOKEN_ADDRESS = "0x398b2eB83C59890a01418b8D661e9A36a7c9d23d"  # Phase 1 mainnet deploy 2026-05-12
APP_BASE_URL = "https://portal.ccmnetwork.net"
API_BASE_URL = "https://ccm-portal-api.misterylee.workers.dev"
RESEND_FROM = "CCM Portal <onboarding@resend.dev>"  # TODO: replace with real ccmnetwork sender once domain is verified

# CarbonPriceOracle (Sepolia rehearsal stack) — keeper Worker pushes hourly price on-chain.
# Keeper private key is a Worker secret: CARBON_KEEPER_PRIVATE_KEY.
CARBON_ORACLE_ADDRESS = "0xF75cAf1ED356158C6FEF1D9DB00048197431FB60"
CARBON_ORACLE_RPC = "https://sepolia.base.org"

# Sandbox NFT (Sepolia) — keeper auto-mints one carbon-credit batch per
# cron tick so the testnet mining timeline keeps producing records.
CCM_SANDBOX_NFT_ADDRESS = "0xbC3EAc7514F82A868807b81b165D2121495380E9"

# Sandbox MockPriceOracles (Sepolia, keeper-owned 2026-05-13 redeploy) —
# keeper walks each price by ±2% per cron tick so the Oracle Price
# History timeline accumulates fresh PriceUpdated events.
ORACLE_ADDRESSES = "0xE1Cb2811C7B34D581a918343E7bB52fb6925D84e,0x3F7F998e8d0AeC3087A9E2A9703B006088972b73,0x5ec883B4b5c1D12e638533f2EF496f550A4e8cC0,0xBc6f5B6365b56d6284c0E3C467EEf37120b0192d"

[[d1_databases]]
binding = "DB"
database_name = "ccm-portal-db"
database_id = "dbd8f008-99a2-48cc-afac-6144fec3f29b"
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *"]

[dev]
port = 8787
