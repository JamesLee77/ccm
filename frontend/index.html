<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/ccm-token-mark.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/ccm-token-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>CCM Network · Carbon Credit Measurement</title>
    <meta name="description" content="The Carbon Credit Standard. Verified. Onchain. DeFi-native." />
    <script>
      // Theme bootstrap — runs before React mounts to prevent flash.
      // Order: stored user preference > "dark" default. We intentionally
      // don't fall back to prefers-color-scheme; the brand default is dark
      // and that's what new visitors should see.
      (() => {
        try {
          var stored = localStorage.getItem("ccm-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
