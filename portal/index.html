<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e0c" />
    <link rel="icon" type="image/svg+xml" href="/ccm-token-mark.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/ccm-token-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>CCM Network · Investor portal</title>
    <meta name="description" content="SAFT investor portal for CCM Network on Base mainnet — vesting, claim, migration. KYC required." />
    <meta name="robots" content="noindex" />
    <script>
      // Pre-React FOUC guard: pick theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem("ccm-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
